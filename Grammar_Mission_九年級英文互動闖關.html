<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Mission｜九年級英文互動闖關</title>
<style>
:root{font-family:Arial,"Noto Sans TC",sans-serif;color:#202938;background:#f4f7fb}
body{margin:0;padding:20px}.app{max-width:760px;margin:auto;background:white;border-radius:20px;padding:24px;box-shadow:0 8px 28px #1d355710}
h1{margin:0 0 6px;font-size:1.7rem}.sub{color:#667085;margin-bottom:20px}
.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{background:#eef2ff;padding:10px 16px;border-radius:12px;font-weight:bold}
.badge{display:inline-block;background:#e6f6ed;color:#17663a;padding:7px 11px;border-radius:999px;font-size:.9rem}
.progress{height:8px;background:#e8edf4;border-radius:9px;margin:14px 0 22px;overflow:hidden}.bar{height:100%;background:#3949ab;width:0;transition:width .2s}
.topic{color:#667085;font-size:.92rem;margin-bottom:12px}.question{font-size:1.25rem;font-weight:700;line-height:1.5;margin:10px 0 18px}
.option{display:block;border:1px solid #d6dce6;border-radius:12px;padding:13px 14px;margin:10px 0;cursor:pointer;line-height:1.4}
.option:hover{background:#f6f8ff;border-color:#8a96d8}.option input{margin-right:10px;transform:scale(1.15)}
button{border:0;border-radius:12px;padding:12px 18px;font-size:1rem;cursor:pointer;background:#273a9b;color:white}
button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eef1f6;color:#253044}
.feedback{margin:18px 0;padding:15px;border-radius:12px;background:#f0f4f8;line-height:1.6}.correct{border-left:5px solid #16834a}.wrong{border-left:5px solid #d97706}
.small{font-size:.85rem;color:#667085}.hidden{display:none}.end{text-align:center;padding:25px 0}.end h2{font-size:1.7rem}
@media(max-width:520px){body{padding:10px}.app{padding:17px}.question{font-size:1.12rem}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>🎯 Grammar Mission</h1><div class="sub">九年級英文互動闖關｜被動語態 × 間接問句</div></div>
    <div class="score">得分：<span id="score">0</span></div>
  </div>
  <div id="game">
    <div class="row"><span id="level" class="badge">LEVEL 1 · 新手暖身</span><span id="count" class="small">第 1 / 36 題</span></div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="topic" class="topic"></div>
    <div id="question" class="question"></div>
    <div id="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="row" style="margin-top:18px">
      <button id="check" disabled>確認答案</button>
      <button id="next" class="hidden">下一題 →</button>
      <button id="restart" class="secondary">重新開始</button>
    </div>
    <p class="small">每題答對得 1 分；作答後會顯示正確答案與文法解析。</p>
  </div>
  <div id="result" class="end hidden"></div>
</div>
<script>
const qs = [
["被動語態","The classroom _____ every day.",["cleans","is cleaned","cleaned","is cleaning"],1,"every day 表示習慣；classroom 是被打掃的對象，所以用 is + p.p."],
["被動語態","English _____ in many countries.",["speaks","is spoken","spoke","is speaking"],1,"English 是被使用的語言，使用被動語態 is spoken。"],
["被動語態","The window was _____ by Tom yesterday.",["break","broke","broken","breaking"],2,"was + 過去分詞。break 的三態是 break–broke–broken。"],
["被動語態","Which sentence is passive?",["Amy loves dogs.","Jack runs fast.","The cake was made by Mom.","They play basketball."],2,"The cake 是接受動作的對象，was made 是被動語態。"],
["被動語態","This book _____ by many students last year.",["reads","is read","was read","read"],2,"last year 表示過去，使用 was + 過去分詞。read 的過去分詞拼法仍是 read。"],
["被動語態","The room _____ now.",["is cleaning","is being cleaned","cleaned","was clean"],1,"now 表示正在進行；現在進行式被動語態為 am/is/are being + p.p."],
["間接問句","Do you know _____ he is?",["where","where is","is where","where does"],0,"間接問句使用「疑問詞 + 主詞 + 動詞」，所以是 where he is。"],
["間接問句","Can you tell me _____?",["what time is it","what time it is","is it what time","what is it time"],1,"間接問句要用直述句語序：what time + it + is。"],
["間接問句","I don't know _____ she likes cats.",["does","that does","if","what does"],2,"這是是否疑問句的間接問句，可以用 if 或 whether。"],
["間接問句","Please tell me _____ you are happy.",["whether","what","where","who"],0,"句子在問「是否開心」，可用 whether 或 if。"],
["間接問句","Do you know where _____?",["does he live","he lives","lives he","is he live"],1,"where 後面接主詞 he，再接動詞 lives。"],
["間接問句","I wonder _____ the store is open.",["what","if","where does","that if"],1,"I wonder if... 表示「我想知道是否……」。"],
["被動語態","The homework _____ by the students last night.",["finished","was finished","is finishing","has finish"],1,"last night 是過去時間，使用 was + finished。"],
["被動語態","These photos _____ by my sister now.",["are taking","are being taken","were took","is taken"],1,"These photos 是複數主詞，現在進行式被動語態為 are being taken。"],
["被動語態","The message has _____ to all the students.",["send","sent","been sent","being sent"],2,"現在完成式被動語態為 has/have been + 過去分詞。"],
["被動語態","Which sentence is correct?",["The letters was sent yesterday.","The letters were sent yesterday.","The letters were send yesterday.","The letters sent yesterday by him."],1,"letters 是複數，所以用 were；send 的過去分詞是 sent。"],
["被動語態","People speak English here. Choose the passive sentence.",["English is spoken here.","English speaks here.","English was speak here.","English is speaking here."],0,"受詞 English 改為主詞，現在簡單式被動語態用 is spoken。"],
["間接問句","Could you tell me _____?",["when will the bus arrive","when the bus will arrive","when does the bus arrive","when did the bus arrive tomorrow"],1,"間接問句用直述句語序；will 放在主詞 the bus 後面。"],
["間接問句","I wonder _____ he didn't come to school.",["why","why did","why was","that why"],0,"why 後面接主詞 he 和動詞 didn't come，不倒裝。"],
["間接問句","Do you know _____ Mary has finished her homework?",["what","whether","where does","why did"],1,"這裡詢問「是否完成」，可以用 whether 或 if；後面是直述句語序。"],
["間接問句","I don't know _____ to take the train or the bus.",["what","whether","where","that"],1,"whether...or... 可表示「是……還是……」，此處用 whether。"],
["間接問句","Which sentence is correct?",["Can you tell me where is the bank?","Can you tell me where the bank is?","Can you tell where does the bank is?","Can you tell me where the bank?"],1,"間接問句的 where 後面用主詞 the bank + 動詞 is。"],
["間接問句","She asked me _____ I was tired.",["that","what","if","where did"],2,"轉述是否疑問句時，可以用 if 引導，且不用倒裝。"],
["混合挑戰","The school gate _____ at 7:30 every morning.",["opens by the guard","is opened by the guard","is opening by the guard","was open by the guard"],1,"every morning 是習慣，school gate 是被開啟的對象，使用 is opened。"],
["混合挑戰","The computer _____ when I entered the room.",["was being repaired","is repairing","was repaired by someone now","has repairing"],0,"當我走進房間時，修理動作正在進行，所以用過去進行式被動語態 was being repaired。"],
["混合挑戰","The winner _____ tomorrow.",["will announce","will be announced","will be announce","is announced yesterday"],1,"tomorrow 是未來時間；未來式被動語態為 will be + p.p."],
["混合挑戰","Which sentence is NOT correct?",["The room is cleaned every day.","The bike was stolen yesterday.","The story was wrote by Sam.","The food will be served soon."],2,"write 的過去分詞是 written，不是 wrote。正確句子是 The story was written by Sam."],
["混合挑戰","Do you remember _____?",["where did we park the car","where we parked the car","where parked we the car","where do we parked the car"],1,"間接問句使用主詞 + 動詞；過去式 parked 不需要 did。"],
["混合挑戰","I'm not sure _____ the game will be canceled.",["what","whether","where does","that whether"],1,"I'm not sure whether... 表示「我不確定是否……」。"],
["混合挑戰","The teacher asked us _____ we had finished the project.",["if","what did","where did","that if"],0,"這是轉述是否疑問句，使用 if + 主詞 + 動詞。"],
["混合挑戰","Choose the correct sentence.",["I wonder what is his name.","I wonder what his name is.","I wonder what does his name mean?","I wonder what his name."],1,"間接問句使用直述句語序：what + his name + is。"],
["混合挑戰","The museum _____ in 1998 and _____ by thousands of people every year.",["built; visits","was built; is visited","was build; was visited","is built; visited"],1,"in 1998 表示過去，用 was built；every year 表示習慣，用 is visited。"],
["混合挑戰","Which question can be changed to 'I don't know whether she is at home.'?",["Where is she?","Is she at home?","Why is she at home?","Who is at home?"],1,"whether she is at home 是「她是否在家」，對應一般疑問句 Is she at home?"],
["混合挑戰","Choose the correct sentence.",["Can you tell me if is he busy?","Can you tell me whether he is busy?","Can you tell me does he busy?","Can you tell me whether is he busy?"],1,"whether 後面使用主詞 he + 動詞 is，不可倒裝。"],
["混合挑戰","The lost dog _____ by a kind family, but nobody knows _____ it belongs to.",["was found; who","found; who does","was find; whose","is finding; who"],0,"狗是被找到的，所以用 was found；who it belongs to 是間接問句語序。"],
["混合挑戰","The coach wants to know _____ the players are ready.",["that","if","what do","where do"],1,"詢問球員「是否準備好了」，使用 if + 主詞 + 動詞。"]
];
let i=0, score=0, selected=null, locked=false;
const $=id=>document.getElementById(id);
function level(n){return n<12?"LEVEL 1 · 新手暖身":n<24?"LEVEL 2 · 任務進階":"LEVEL 3 · 終極挑戰"}
function render(){
 const q=qs[i]; selected=null;locked=false;
 $("score").textContent=score;$("count").textContent=`第 ${i+1} / ${qs.length} 題`;
 $("level").textContent=level(i);$("bar").style.width=((i+1)/qs.length*100)+"%";
 $("topic").textContent="題型："+q[0];$("question").textContent=q[1];
 $("options").innerHTML="";
 q[2].forEach((o,j)=>{
   const lab=document.createElement("label");lab.className="option";
   const radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.value=j;
   radio.addEventListener("change",()=>{selected=j;$("check").disabled=false});
   lab.append(radio,document.createTextNode(" "+String.fromCharCode(65+j)+". "+o));$("options").appendChild(lab);
 });
 $("feedback").className="feedback hidden";$("feedback").textContent="";
 $("check").classList.remove("hidden");$("check").disabled=true;$("next").classList.add("hidden");
}
$("check").addEventListener("click",()=>{
 if(selected===null||locked)return;locked=true;const q=qs[i],ok=selected===q[3];
 if(ok)score++;$("score").textContent=score;
 document.querySelectorAll('input[name="answer"]').forEach(el=>el.disabled=true);
 $("feedback").className="feedback "+(ok?"correct":"wrong");
 $("feedback").innerHTML=`<strong>${ok?"✅ 答對了！":"📘 再記住這個觀念"}</strong><br>正確答案：<strong>${String.fromCharCode(65+q[3])}. ${q[2][q[3]]}</strong><br>${q[4]}`;
 $("check").classList.add("hidden");$("next").classList.remove("hidden");$("next").textContent=i===qs.length-1?"查看闖關成績":"下一題 →";
});
$("next").addEventListener("click",()=>{
 if(i<qs.length-1){i++;render();return}
 $("game").classList.add("hidden");$("result").classList.remove("hidden");
 const pct=Math.round(score/qs.length*100);
 let msg=pct>=88?"太棒了！你已經掌握大部分句型，可以挑戰更進階的會考題。":pct>=67?"表現不錯！再複習答錯的題目，尤其留意動詞三態和間接問句語序。":"完成就是進步！建議先複習基本句型，再重新挑戰一次。";
 $("result").innerHTML=`<h2>🏆 闖關完成！</h2><p style="font-size:1.5rem;font-weight:bold">${score} / ${qs.length} 題（${pct}%）</p><p>${msg}</p><button id="again">重新挑戰</button>`;
 $("again").addEventListener("click",reset);
});
function reset(){i=0;score=0;$("game").classList.remove("hidden");$("result").classList.add("hidden");render()}
$("restart").addEventListener("click",reset);render();
</script>
</body>
</html>
